[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ie-agent"
version = "0.1.0"
description = "可审核的信息工程习题解答多智能体系统"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.10,<4",
  "mcp>=1.28,<2",
  "numpy>=2,<3",
  "numexpr>=2.10,<3",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pylatexenc>=2.10,<3",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "scikit-learn>=1.7,<2",
  "textual>=6,<7",
  "textual-image>=0.13,<1",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
qwen = [
  "chromadb>=1.0,<2",
  "sentence-transformers>=2.7,<6",
  "torch>=2.7,<3",
  "tqdm>=4.67,<5",
  "transformers>=4.51,<6",
]

[project.scripts]
ie-agent = "ie_agent.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ie_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
